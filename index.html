<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#a8e6cf">
<title>生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 100% at 50% 0%, #d9f5e9 0%, #eefaf4 42%, #ffffff 100%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: hidden; color: #2f4f45;
  }
  .card {
    width: 100%; max-width: 340px; text-align: center;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(168,230,207,.65);
    border-radius: 28px; padding: 40px 28px 34px;
    box-shadow: 0 18px 50px -18px rgba(80,160,135,.45), 0 2px 10px rgba(80,160,135,.08);
    position: relative; z-index: 2;
  }
  .cake { font-size: 44px; line-height: 1; margin-bottom: 14px; display: block; }
  h1 { font-size: 25px; font-weight: 600; letter-spacing: .1em; margin-bottom: 8px; }
  .sub { font-size: 13px; color: #7ba79a; letter-spacing: .06em; margin-bottom: 32px; }

  .player { position: relative; width: 132px; height: 132px; margin: 0 auto 22px; }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .track { stroke: rgba(168,230,207,.45); }
  .ring .prog { stroke: #5cc4a4; stroke-linecap: round; transition: stroke-dashoffset .15s linear; }
  .btn {
    position: absolute; inset: 14px; border: none; cursor: pointer;
    border-radius: 50%; background: linear-gradient(160deg, #a8e6cf 0%, #7fd4b4 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px -8px rgba(92,196,164,.85);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .btn:active { transform: scale(.94); box-shadow: 0 6px 14px -8px rgba(92,196,164,.9); }
  .btn svg { width: 44px; height: 44px; fill: #fff; }
  .btn .icon-pause { display: none; }
  body.playing .btn .icon-play { display: none; }
  body.playing .btn .icon-pause { display: block; }
  body.playing .player::after {
    content: ""; position: absolute; inset: 6px; border-radius: 50%;
    border: 1px solid rgba(92,196,164,.55); animation: pulse 2.2s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: .8; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .time { font-size: 12px; color: #9bbdb2; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
  .hint { margin-top: 26px; font-size: 12px; color: #a9c9be; letter-spacing: .08em; }

  .fx { position: fixed; inset: 0; pointer-events: none; z-index: 1; overflow: hidden; }
  .heart {
    position: absolute; bottom: -40px; font-size: 18px; opacity: 0;
    animation: rise linear forwards;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(.6) rotate(0deg); opacity: 0; }
    12% { opacity: .9; }
    100% { transform: translateY(-108vh) scale(1.05) rotate(28deg); opacity: 0; }
  }
</style>
</head>
<body>
<div class="fx" id="fx"></div>
<div class="card">
  <span class="cake">🎂</span>
  <h1>生日快乐</h1>
  <p class="sub">HAPPY BIRTHDAY</p>

  <div class="player">
    <svg class="ring" viewBox="0 0 132 132">
      <circle class="track" cx="66" cy="66" r="64"></circle>
      <circle class="prog" id="prog" cx="66" cy="66" r="64"
              stroke-dasharray="402.1" stroke-dashoffset="402.1"></circle>
    </svg>
    <button class="btn" id="btn" aria-label="播放">
      <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5.14v13.72c0 .8.87 1.3 1.56.9l11-6.86a1.05 1.05 0 0 0 0-1.8l-11-6.86A1.05 1.05 0 0 0 8 5.14z"/></svg>
      <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.6"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.6"/></svg>
    </button>
  </div>

  <div class="time" id="time">00:00 / 00:20</div>
  <p class="hint">轻触播放 · 乖乖天天开心</p>
</div>

<audio id="audio" src="./birthday.mp3" preload="auto" playsinline></audio>
<script>
  var audio = document.getElementById('audio');
  var btn = document.getElementById('btn');
  var prog = document.getElementById('prog');
  var time = document.getElementById('time');
  var fx = document.getElementById('fx');
  var LEN = 402.1;
  var timer = null;

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function paint() {
    var d = audio.duration || 20;
    var p = Math.min(1, (audio.currentTime || 0) / d);
    prog.style.strokeDashoffset = LEN * (1 - p);
    time.textContent = fmt(audio.currentTime) + ' / ' + fmt(d);
  }
  function hearts() {
    var chars = ['🤍', '🎈', '✨', '🌿', '🎀'];
    for (var i = 0; i < 3; i++) {
      var el = document.createElement('div');
      el.className = 'heart';
      el.textContent = chars[Math.floor(Math.random() * chars.length)];
      el.style.left = (8 + Math.random() * 84) + '%';
      el.style.animationDuration = (5 + Math.random() * 3) + 's';
      el.style.animationDelay = (Math.random() * 1.2) + 's';
      fx.appendChild(el);
      (function (n) { setTimeout(function () { n.remove(); }, 9000); })(el);
    }
  }
  btn.addEventListener('click', function () {
    if (audio.paused) {
      audio.play().catch(function () {});
    } else {
      audio.pause();
    }
  });
  audio.addEventListener('play', function () {
    document.body.classList.add('playing');
    hearts();
    clearInterval(timer);
    timer = setInterval(function () { hearts(); }, 2400);
  });
  audio.addEventListener('pause', function () {
    document.body.classList.remove('playing');
    clearInterval(timer);
  });
  audio.addEventListener('timeupdate', paint);
  audio.addEventListener('ended', function () {
    document.body.classList.remove('playing');
    prog.style.strokeDashoffset = LEN;
    time.textContent = '00:00 / ' + fmt(audio.duration);
    clearInterval(timer);
  });
  audio.addEventListener('loadedmetadata', paint);
</script>
</body>
</html>
